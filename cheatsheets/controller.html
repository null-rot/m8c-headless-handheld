<html>
<head>
	<script src="jquery-3.6.3.min.js"></script>
	<script src="script-controller.js"></script>
	<link href="fonts/sofiasans.css" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="controller.css">
</head>
<body>

<div class="guide">
	<div class="row">
		<div class="cut"></div>
		<div class="fold"></div>
		<div class="cut rotate90"></div>
	</div>
	<div class="row">
		<div class="fold rotate90"></div>
		<div>
			<div class="spread" id="recto"></div>
			<div class="spread" id="verso"></div>
		</div>
		<div class="fold rotate90"></div>
	</div >
	<div class="row">
		<div class="cut rotate270"></div>
		<div class="fold"></div>
		<div class="cut rotate180"></div>
	</div>
</div>

<div class="version">M8 Shortcuts - Controller Edition &middot; m8c on muOS / Anbernic &middot; shortcuts &amp; layout after LaurentVitalis/M8Guide &middot; M8 by Dirtywave &middot; firmware 4.0.3</div>

<div class="to_hide">
	<div id="template" class="action">
		<div class="action_text">
			<span class="name">Screen Navigation</span>&nbsp;<span class="secondary"></span><br>
			<span class="description">hold SHIFT + tap [ UP or DOWN or LEFT or RIGHT ]</span><br>
			<span class="extra"></span>
		</div>
		<div class="action_buttons">
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="30" fill="none" viewBox="0 0 48 30" class="buttons">
  <g class="button_pad">

	<!-- ===== Shoulders ===== -->
	<g class="l1_button">
	  <rect class="placeholder" x="1" y="0.5" width="9" height="3.5" rx="1" fill="#CCC"/>
	  <rect class="bkg" x="1" y="0.5" width="9" height="3.5" rx="1" fill="#000"/>
	  <g class="hold">
		<rect x="1" y="0.5" width="9" height="3.5" rx="1" fill="#000"/>
		<path d="M4.4 1.5 L6.6 1.5 L5.5 3.2 Z" fill="#fff"/>
	  </g>
	  <text class="first" x="5.5" y="2.85" font-size="2.6" fill="#fff" text-anchor="middle">1</text>
	  <text class="second" x="5.5" y="2.85" font-size="2.6" fill="#fff" text-anchor="middle">2</text>
	</g>
	<text class="btnlabel" x="11" y="3.4" font-size="2.4" text-anchor="start">L1</text>

	<g class="unused">
	  <rect class="placeholder" x="38" y="0.5" width="9" height="3.5" rx="1" fill="#EEE"/>
	</g>
	<text class="unused-label" x="37" y="3.4" font-size="2.4" text-anchor="end">R1</text>

	<!-- ===== D-pad ===== -->
	<text class="btnlabel" x="8.5" y="7.4" font-size="2.4" text-anchor="middle">D-PAD</text>

	<g class="up_button">
	  <rect class="placeholder" x="6" y="8.5" width="5" height="5" rx="0.6" fill="#CCC"/>
	  <rect class="bkg" x="6" y="8.5" width="5" height="5" rx="0.6" fill="#000"/>
	  <g class="hold">
		<rect x="6" y="8.5" width="5" height="5" rx="0.6" fill="#000"/>
		<path d="M7.4 10.5 L9.6 10.5 L8.5 12.2 Z" fill="#fff"/>
	  </g>
	  <text class="first" x="8.5" y="11.9" font-size="3.2" fill="#fff" text-anchor="middle">1</text>
	  <text class="second" x="8.5" y="11.9" font-size="3.2" fill="#fff" text-anchor="middle">2</text>
	  <g class="double_tap">
		<rect x="9.3" y="5.6" width="4.2" height="3" rx="0.7" fill="#000"/>
		<text x="11.4" y="7.9" font-size="2.3" fill="#fff" text-anchor="middle">x2</text>
	  </g>
	</g>

	<g class="left_button">
	  <rect class="placeholder" x="1" y="13.5" width="5" height="5" rx="0.6" fill="#CCC"/>
	  <rect class="bkg" x="1" y="13.5" width="5" height="5" rx="0.6" fill="#000"/>
	  <g class="hold">
		<rect x="1" y="13.5" width="5" height="5" rx="0.6" fill="#000"/>
		<path d="M2.4 15.5 L4.6 15.5 L3.5 17.2 Z" fill="#fff"/>
	  </g>
	  <text class="first" x="3.5" y="16.9" font-size="3.2" fill="#fff" text-anchor="middle">1</text>
	  <text class="second" x="3.5" y="16.9" font-size="3.2" fill="#fff" text-anchor="middle">2</text>
	</g>

	<g class="right_button">
	  <rect class="placeholder" x="11" y="13.5" width="5" height="5" rx="0.6" fill="#CCC"/>
	  <rect class="bkg" x="11" y="13.5" width="5" height="5" rx="0.6" fill="#000"/>
	  <g class="hold">
		<rect x="11" y="13.5" width="5" height="5" rx="0.6" fill="#000"/>
		<path d="M12.4 15.5 L14.6 15.5 L13.5 17.2 Z" fill="#fff"/>
	  </g>
	  <text class="first" x="13.5" y="16.9" font-size="3.2" fill="#fff" text-anchor="middle">1</text>
	  <text class="second" x="13.5" y="16.9" font-size="3.2" fill="#fff" text-anchor="middle">2</text>
	</g>

	<g class="down_button">
	  <rect class="placeholder" x="6" y="18.5" width="5" height="5" rx="0.6" fill="#CCC"/>
	  <rect class="bkg" x="6" y="18.5" width="5" height="5" rx="0.6" fill="#000"/>
	  <g class="hold">
		<rect x="6" y="18.5" width="5" height="5" rx="0.6" fill="#000"/>
		<path d="M7.4 20.5 L9.6 20.5 L8.5 22.2 Z" fill="#fff"/>
	  </g>
	  <text class="first" x="8.5" y="21.9" font-size="3.2" fill="#fff" text-anchor="middle">1</text>
	  <text class="second" x="8.5" y="21.9" font-size="3.2" fill="#fff" text-anchor="middle">2</text>
	</g>

	<!-- ===== Face buttons (X top, Y left, A right, B bottom) ===== -->
	<g class="unused">
	  <circle class="placeholder" cx="37" cy="10.8" r="2.7" fill="#EEE"/>
	</g>
	<text class="unused-label" x="37" y="7.7" font-size="2.4" text-anchor="middle">X</text>

	<g class="unused">
	  <circle class="placeholder" cx="31.6" cy="16" r="2.7" fill="#EEE"/>
	</g>
	<text class="unused-label" x="27.9" y="16.9" font-size="2.4" text-anchor="end">Y</text>

	<g class="edit_button">
	  <circle class="placeholder" cx="42.4" cy="16" r="2.7" fill="#CCC"/>
	  <circle class="bkg" cx="42.4" cy="16" r="2.7" fill="#000"/>
	  <g class="hold">
		<circle cx="42.4" cy="16" r="2.7" fill="#000"/>
		<path d="M41.3 15.4 L43.5 15.4 L42.4 17.1 Z" fill="#fff"/>
	  </g>
	  <text class="first" x="42.4" y="17.1" font-size="3.2" fill="#fff" text-anchor="middle">1</text>
	  <text class="second" x="42.4" y="17.1" font-size="3.2" fill="#fff" text-anchor="middle">2</text>
	  <g class="double_tap">
		<rect x="43.8" y="10.8" width="4.2" height="3" rx="0.7" fill="#000"/>
		<text x="45.9" y="13.1" font-size="2.3" fill="#fff" text-anchor="middle">x2</text>
	  </g>
	</g>
	<text class="btnlabel" x="42.4" y="21.4" font-size="2.4" text-anchor="middle">A</text>

	<g class="option_button">
	  <circle class="placeholder" cx="37" cy="21.2" r="2.7" fill="#CCC"/>
	  <circle class="bkg" cx="37" cy="21.2" r="2.7" fill="#000"/>
	  <g class="hold">
		<circle cx="37" cy="21.2" r="2.7" fill="#000"/>
		<path d="M35.9 20.6 L38.1 20.6 L37 22.3 Z" fill="#fff"/>
	  </g>
	  <text class="first" x="37" y="22.3" font-size="3.2" fill="#fff" text-anchor="middle">1</text>
	  <text class="second" x="37" y="22.3" font-size="3.2" fill="#fff" text-anchor="middle">2</text>
	</g>
	<text class="btnlabel" x="33.4" y="21.9" font-size="2.4" text-anchor="end">B</text>

	<!-- ===== SELECT / START ===== -->
	<g class="shift_button">
	  <rect class="placeholder" x="14.5" y="24.7" width="7" height="3.2" rx="1.2" fill="#CCC"/>
	  <rect class="bkg" x="14.5" y="24.7" width="7" height="3.2" rx="1.2" fill="#000"/>
	  <g class="hold">
		<rect x="14.5" y="24.7" width="7" height="3.2" rx="1.2" fill="#000"/>
		<path d="M17 25.5 L19 25.5 L18 27 Z" fill="#fff"/>
	  </g>
	  <text class="first" x="18" y="27.1" font-size="2.4" fill="#fff" text-anchor="middle">1</text>
	  <text class="second" x="18" y="27.1" font-size="2.4" fill="#fff" text-anchor="middle">2</text>
	</g>
	<text class="btnlabel" x="18" y="29.5" font-size="1.8" text-anchor="middle">SELECT</text>

	<g class="play_button">
	  <rect class="placeholder" x="24.5" y="24.7" width="7" height="3.2" rx="1.2" fill="#CCC"/>
	  <rect class="bkg" x="24.5" y="24.7" width="7" height="3.2" rx="1.2" fill="#000"/>
	  <g class="hold">
		<rect x="24.5" y="24.7" width="7" height="3.2" rx="1.2" fill="#000"/>
		<path d="M27 25.5 L29 25.5 L28 27 Z" fill="#fff"/>
	  </g>
	  <text class="first" x="28" y="27.1" font-size="2.4" fill="#fff" text-anchor="middle">1</text>
	  <text class="second" x="28" y="27.1" font-size="2.4" fill="#fff" text-anchor="middle">2</text>
	</g>
	<text class="btnlabel" x="28" y="29.5" font-size="1.8" text-anchor="middle">START</text>

  </g>
</svg>
		</div>
	</div>
</div>

</body>
</html>
