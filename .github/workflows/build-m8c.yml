# Builds m8c + kernel modules for the H700 handhelds in the cloud, using the
# exact same Dockerfile/build_script pipeline as the local `./build.sh`.
#
# Manual only - builds are infrequent, no point burning Actions minutes on
# every push. Every run uploads a staging Artifact so the build can be tested
# on-device first; only set `publish_release: true` once it's confirmed good,
# which additionally cuts a GitHub Release with the same files attached.
#
# Pinned to v1.7.10 by default - that's the last version confirmed working on
# device (SDL2). Newer laamaa/m8c releases moved to SDL3, which doesn't run on
# this hardware without extra work - see docs/sdl3-westonpack-notes.md.
#
# Once that's sorted, flip `default: '1.7.10'` below to `default: ''` and
# build.sh's own resolve_m8c_version() will pick up the latest release
# automatically - no other changes needed here.

name: Build m8c

on:
  workflow_dispatch:
    inputs:
      m8c_version:
        description: "m8c version to build (e.g. 1.7.10, no 'v' prefix). Leave blank for the latest laamaa/m8c release."
        required: false
        default: '1.7.10'
      publish_release:
        description: 'Also publish a GitHub Release with these files (only after testing the staged artifact on-device).'
        type: boolean
        required: false
        default: false
      muos_tested_version:
        description: 'muOS version this build was confirmed working on (release notes only).'
        required: false
        default: '2601.1_FUNKY_JACARANDA'
      muos_tested_device:
        description: 'Device this build was confirmed working on (release notes only).'
        required: false
        default: 'Anbernic RG40XX-V'
      knulli_status:
        description: 'Knulli status line for the release notes - update once someone has tested a build on real Knulli hardware.'
        required: false
        default: "not tested yet on real hardware - builds and passes the packaging checks, but hasn't been verified on-device"

permissions:
  contents: write

concurrency:
  group: build-m8c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          VERSION="${{ github.event.inputs.m8c_version || '1.7.10' }}"
          echo "M8C_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building m8c v$VERSION (or latest, if blank)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build m8c (Knulli + muOS packages)
        run: ./build.sh

      - name: Summarize output
        if: always()
        run: |
          {
            echo "### Output tree"
            echo '```'
            find output -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package per-platform zips
        run: |
          cd output
          zip -r "../m8c-knulli-v${M8C_VERSION}.zip" knulli
          zip -r "../m8c-muos-v${M8C_VERSION}.zip" muos

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: m8c-v${{ env.M8C_VERSION }}-${{ github.run_number }}
          path: |
            m8c-knulli-v${{ env.M8C_VERSION }}.zip
            m8c-muos-v${{ env.M8C_VERSION }}.zip
          if-no-files-found: error

      - name: Publish release
        if: github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MUOS_VERSION: ${{ github.event.inputs.muos_tested_version }}
          MUOS_DEVICE: ${{ github.event.inputs.muos_tested_device }}
          KNULLI_STATUS: ${{ github.event.inputs.knulli_status }}
        run: |
          TAG="m8c-v${M8C_VERSION}-run${{ github.run_number }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          RUN_URL="$REPO_URL/actions/runs/${{ github.run_id }}"
          INSTALL_URL="$REPO_URL/blob/main/docs/install.md"

          sed \
            -e "s|__M8C_VERSION__|${M8C_VERSION}|g" \
            -e "s|__RUN_URL__|${RUN_URL}|g" \
            -e "s|__INSTALL_URL__|${INSTALL_URL}|g" \
            -e "s|__MUOS_VERSION__|${MUOS_VERSION}|g" \
            -e "s|__MUOS_DEVICE__|${MUOS_DEVICE}|g" \
            -e "s|__KNULLI_STATUS__|${KNULLI_STATUS}|g" \
            .github/release-notes-template.md > RELEASE_NOTES.md

          gh release create "$TAG" \
            "m8c-knulli-v${M8C_VERSION}.zip" \
            "m8c-muos-v${M8C_VERSION}.zip" \
            --title "m8c v${M8C_VERSION} (build #${{ github.run_number }})" \
            --notes-file RELEASE_NOTES.md
